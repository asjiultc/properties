<!DOCTYPE html>
<html lang="sq">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Property Details</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<h1>Property Details</h1>

<a href="index.html" class="back-button">
← Kthehu te pronat
</a>

</header>



<main id="property-detail" class="property-detail">

</main>




<!-- LIGHTBOX -->

<div id="lightbox" class="lightbox">


<button class="lightbox-close" onclick="closeImage()">
✕
</button>


<button class="lightbox-prev" onclick="prevImage()">
❮
</button>



<img id="lightbox-image">



<button class="lightbox-next" onclick="nextImage()">
❯
</button>



<div id="image-counter"></div>


</div>







<script src="./data.js"></script>



<script>


const params = new URLSearchParams(window.location.search);


const propertyID = params.get("id");



const property = window.properties.find(

item => item.id === propertyID

);




const container = document.getElementById("property-detail");





if(property){



container.innerHTML = `



<div class="detail-header">


<h2>

${property.title}

</h2>



<span class="status ${property.statusClass}">

${property.status}

</span>



</div>







<div class="info-box">



<p>

📍 <strong>Lokacioni:</strong><br>

${property.location}

</p>




<p>

💶 <strong>Çmimi:</strong><br>

${property.price}

</p>




<p>

📐 <strong>Sipërfaqja:</strong><br>

${property.area}

</p>





${property.rooms ? `

<p>

🛏 <strong>Dhomat:</strong><br>

${property.rooms}

</p>

` : ""}





${property.balcony ? `

<p>

🌅 <strong>Balkone:</strong><br>

${property.balcony}

</p>

` : ""}






${property.bathrooms ? `

<p>

🚿 <strong>Banjo:</strong><br>

${property.bathrooms}

</p>

` : ""}






${property.floor ? `

<p>

🏢 <strong>Kati:</strong><br>

${property.floor}

</p>

` : ""}






${property.elevator ? `

<p>

🛗 <strong>Ashensor:</strong><br>

${property.elevator}

</p>

` : ""}





${property.parking ? `

<p>

🚗 <strong>Parkim:</strong><br>

${property.parking}

</p>

` : ""}





${property.availableDate ? `

<p>

📅 <strong>Disponueshme:</strong><br>

${property.availableDate}

</p>

` : ""}




</div>







<h3>

Përshkrimi

</h3>



<p class="description">

${property.description}

</p>







<h3>

Galeria

</h3>




<div class="gallery">



${property.images.map(image => `



<img

src="${image}"

alt="${property.title}"

class="gallery-image"

onclick="openImage('${image}')"



>



`).join("")}



</div>







${property.video ? `



<h3>

Video

</h3>




<video class="video" controls>



<source src="${property.video}" type="video/mp4">



</video>




` : ""}







${property.map ? `



<h3>

Lokacioni

</h3>




<a

href="${property.map}"

target="_blank"

class="button">


📍 Hap në Google Maps


</a>





<br><br>





<iframe


src="${property.map}&output=embed"


width="100%"


height="350"


style="border:0;border-radius:12px"


loading="lazy">



</iframe>





` : ""}







<br><br>







${property.download ? `



<a

href="${property.download}"

class="download-button">


📥 Shkarko Fotot / Materialet


</a>




` : ""}







`;




}

else{


container.innerHTML = `


<h2>

Prona nuk u gjet.

</h2>



<a href="index.html">

Kthehu

</a>


`;

}








// =======================
// LIGHTBOX
// =======================



let currentImages = property.images;


let currentIndex = 0;






window.openImage = function(src){



currentIndex = currentImages.indexOf(src);



showImage();



};







function showImage(){



const lightbox = document.getElementById("lightbox");


const image = document.getElementById("lightbox-image");


const counter = document.getElementById("image-counter");





image.src = currentImages[currentIndex];



counter.innerHTML = 

(currentIndex + 1) + " / " + currentImages.length;




lightbox.style.display = "flex";



}








window.closeImage = function(){



document.getElementById("lightbox").style.display="none";



}







window.nextImage=function(){



currentIndex++;



if(currentIndex >= currentImages.length){


currentIndex=0;


}



showImage();



}








window.prevImage=function(){



currentIndex--;



if(currentIndex < 0){


currentIndex=currentImages.length-1;


}



showImage();



}








document.addEventListener("keydown",function(e){



if(e.key==="Escape"){


closeImage();


}



if(e.key==="ArrowRight"){


nextImage();


}



if(e.key==="ArrowLeft"){


prevImage();


}



});







</script>



</body>

</html>
